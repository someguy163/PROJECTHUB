# 이 저장소의 master 브랜치에 푸시하면 허브 페이지(index.html)를 InfinityFree 로 FTP 업로드한다.
# TRIPMATE 의 deploy.yml 과 같은 방식이다. GitHub 서버가 대신 올려 주므로 내 컴퓨터에서 올릴 필요가 없다.
#
# 처음 한 번만 할 일 (첫 푸시 전에 끝내 둘 것)
#   1) InfinityFree 에서 허브용 호스팅 계정을 만든다.
#   2) GitHub 저장소 > Settings > Secrets and variables > Actions > "New repository secret" 으로 3개를 만든다
#        FTP_SERVER    InfinityFree 계정 화면의 FTP 호스트 이름
#        FTP_USERNAME  같은 화면의 FTP 사용자 이름 (if0_숫자 형태)
#        FTP_PASSWORD  같은 화면의 FTP 비밀번호 (이 값은 GitHub 의 비밀 저장소에만 입력하고 어디에도 붙여 넣지 않는다)
#   3) 이후에는 master 에 푸시하면 자동으로 배포된다. (직접 하려면 Actions 탭 > "허브 배포" > "Run workflow")
#
# 서버에 올라가는 것은 아래 "올릴 파일 모으기" 단계에 적은 파일뿐이다.
# 이 저장소에는 CodeIgniter 골격(application/, system/, index.php ...)도 들어 있는데, 서버에 올라가면
# 허브 대신 CodeIgniter 화면이 뜨므로 일부러 올리지 않는다.
# 올릴 파일이 늘면 cp 줄과 아래 paths 에 같이 추가한다.
name: 허브 배포

on:
  push:
    branches: [master]
    # 서버에 올라가는 파일이 바뀌었을 때만 배포한다
    paths:
      - 'index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 푸시가 연달아 와도 배포가 동시에 돌지 않게 한다 (FTP 가 서로 엉키지 않도록 줄 세움)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 비밀 값을 안 넣고 푸시하면 FTP 오류가 알아보기 어렵게 나오므로 먼저 확인한다
      - name: 비밀 값 확인
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$S" ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME, FTP_PASSWORD 를 저장소 Settings > Secrets and variables > Actions 에 먼저 등록하세요."
            exit 1
          fi

      - name: 올릴 파일 모으기
        run: |
          mkdir _site
          cp index.html _site/

      - name: FTP 로 업로드
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./_site/
          server-dir: htdocs/
