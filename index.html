<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECTHUB</title>
<meta name="description" content="TripMate, DinnerSpot 등 내 서비스 입장권 모음">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎟️%3C/text%3E%3C/svg%3E">
<!-- 글꼴: 제목은 주아체(Jua), 본문은 Pretendard. 못 불러오면 시스템 글꼴로 대체된다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
  // 첫 화면이 번쩍이지 않도록 CSS 보다 먼저 테마를 정한다: 저장된 선택 > 기기 설정
  (function () {
    var t; try { t = localStorage.getItem('hub-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --paper: #E9EFF2; --surface: #fff; --ink: #14212B; --muted: #55677A; --line: #CBD7DD;
    --display: "Jua", "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #0F171C; --surface: #18252C; --ink: #EAF1F4; --muted: #93A5AF; --line: #2B3C46;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px 16px clamp(40px, 8vw, 88px);
    background: var(--paper); color: var(--ink);
    font: 16px/1.6 "Pretendard Variable", Pretendard, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    word-break: keep-all; overflow-wrap: break-word; /* 한글을 단어 단위로 줄바꿈 */
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1080px; margin: 0 auto; }

  .bar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .logo { font: 400 1.15rem var(--display); color: var(--muted); }

  /* 해 / 달 스위치: 동그란 손잡이 안의 그림이 지금 모드를 보여 준다 */
  .theme {
    position: relative; flex: none; width: 66px; height: 38px; padding: 0;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer;
  }
  .theme:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .knob {
    position: absolute; top: 3px; left: 3px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 16px; line-height: 1; background: var(--paper);
    transition: transform .25s cubic-bezier(.4, .2, .2, 1);
  }
  .knob::before { content: "☀️"; }
  [data-theme="dark"] .knob { transform: translateX(28px); }
  [data-theme="dark"] .knob::before { content: "🌙"; }

  .hero { padding: clamp(36px, 9vw, 88px) 0 clamp(28px, 6vw, 52px); }
  h1 { margin: 0; font: 400 clamp(2.5rem, 9vw, 4.6rem)/1.12 var(--display); letter-spacing: -.02em; text-wrap: balance; }
  .sub { margin: 14px 0 0; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.15rem); }

  /* 프로젝트 하나 = 입장권 한 장. 260px 이상으로 가능한 만큼 가로로 채우고 모자라면 줄바꿈 (폰에서는 1열) */
  .cards { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
  .card {
    --c: #888;      /* 카드마다 style="--c:#색" 로 정한다 */
    --stub: 56px;   /* 아래 "입장" 칸 높이 */
    position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px;
    min-height: 230px; padding: 24px 24px 0;
    background: var(--surface); color: inherit; text-decoration: none;
    border-radius: 22px; box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .15s ease-out, box-shadow .15s ease-out;
  }
  /* 절취선 양옆의 홈: 바탕색 원을 카드 가장자리에 걸쳐 놓고 바깥 절반은 overflow 로 잘라 낸다 */
  .card::before, .card::after {
    content: ""; position: absolute; bottom: calc(var(--stub) - 11px); width: 22px; height: 22px;
    border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line);
  }
  .card::before { left: -11px; }
  .card::after { right: -11px; }
  .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .card:focus-visible, .card:active { transform: translate(-3px, -3px); box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--c); }
  @media (hover: hover) {
    .card:hover { transform: translate(-3px, -3px); box-shadow: inset 0 0 0 1px var(--line), 6px 6px 0 var(--c); }
  }

  .emoji {
    width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 10px;
    border-radius: 50%; font-size: 1.9rem;
    background: color-mix(in srgb, var(--c) 24%, var(--surface));
  }
  .card h2 { margin: 0; font: 400 1.55rem/1.2 var(--display); }
  .card p { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }

  .stub {
    margin: auto -24px 0; height: var(--stub); padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--c); color: #10171B; font-size: .85rem; font-weight: 600;
    border-top: 2px dashed var(--surface);   /* 절취선 */
  }
  .stub span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stub::after { content: "입장"; margin-left: auto; font-size: 1rem; font-weight: 800; }

  @media (prefers-reduced-motion: reduce) { .card, .knob { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <span class="logo">PROJECTHUB</span>
    <button class="theme" type="button" aria-label="다크 모드" aria-pressed="false" title="다크 / 라이트 전환">
      <span class="knob" aria-hidden="true"></span>
    </button>
  </div>

  <header class="hero">
    <h1>오늘은 뭐 할까요?</h1>
    <p class="sub">서비스를 하나 골라 입장하세요.</p>
  </header>

  <!--
    프로젝트를 추가하려면 아래 <a class="card"> 한 덩어리를 복사해 붙이고 다섯 곳만 바꾼다:
    href(주소) / --c(티켓 색, 밝은 색 권장 — 입장 칸 글자가 어두운 색이다) / 이모지 / 제목 / 설명
    카드는 새 탭으로 열린다(target="_blank"). 복사하면 같이 따라오고, 같은 탭에서 열려면 target 과 rel 을 지운다
    내 컴퓨터(XAMPP)에서 확인할 때는 href 를 ../TRIPMATE/ , ../DINNERSPOT/ 로 바꾼다
  -->
  <div class="cards">
    <a class="card" style="--c:#2CBBA9" href="https://tripmate.infinityfree.me/" target="_blank" rel="noopener noreferrer">
      <span class="emoji" aria-hidden="true">🧳</span>
      <h2>TripMate</h2>
      <p>친구들과 여행지를 투표로 정하고, 일정을 같이 짜요.</p>
      <span class="stub"></span>
    </a>
    <a class="card" style="--c:#FF7A45" href="https://dinnerspot.infinityfree.me/" target="_blank" rel="noopener noreferrer">
      <span class="emoji" aria-hidden="true">🍻</span>
      <h2>DinnerSpot</h2>
      <p>회식 장소를 조건에 맞춰 추천받고, 팀 투표로 정해요.</p>
      <span class="stub"></span>
    </a>
  </div>
</main>
<script>
  var root = document.documentElement, btn = document.querySelector('.theme');
  function sync() { btn.setAttribute('aria-pressed', root.dataset.theme === 'dark'); }
  btn.onclick = function () {
    var t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = t;
    try { localStorage.setItem('hub-theme', t); } catch (e) {}
    sync();
  };
  sync();

  // 입장 칸에 주소(도메인)를 자동으로 적는다 — 카드마다 따로 쓸 필요 없음
  document.querySelectorAll('.stub').forEach(function (s) {
    var h = document.createElement('span');
    h.textContent = s.parentNode.hostname;
    s.appendChild(h);
  });
</script>
</body>
</html>
