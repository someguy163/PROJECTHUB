<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECTHUB</title>
<meta name="description" content="TripMate, DinnerSpot 등 내 프로젝트 바로가기">
<script>
  // 첫 화면이 번쩍이지 않도록 CSS 보다 먼저 테마를 정한다: 저장된 선택 > 기기 설정
  (function () {
    var t; try { t = localStorage.getItem('hub-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --paper: #F6F5F1; --ink: #1B1F23; --muted: #5C656D; --line: #DAD8D0; --surface: #fff;
    --accent-s: 75%; --accent-l: 42%;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #121416; --ink: #ECEEEF; --muted: #98A2AA; --line: #2A3036; --surface: #1A1E22;
    --accent-l: 60%;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: clamp(24px, 6vw, 64px) 16px;
    background: var(--paper); color: var(--ink);
    word-break: keep-all; overflow-wrap: break-word; /* 한글을 단어 단위로 줄바꿈 */
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 { margin: 0 0 4px; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.2; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--muted); }

  .theme {
    flex: none; width: 44px; height: 44px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink);
    font-size: 1.25rem; cursor: pointer;
  }
  .theme:hover { border-color: var(--muted); }
  .theme:focus-visible, .card:focus-visible { outline: 3px solid var(--accent, var(--ink)); outline-offset: 2px; }
  .theme .sun, [data-theme="dark"] .theme .moon { display: none; }
  [data-theme="dark"] .theme .sun { display: inline; }

  /* 카드는 260px 이상으로 가능한 만큼 가로로 채우고, 모자라면 알아서 줄바꿈한다 (폰에서는 1열) */
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
  .card {
    --accent: hsl(var(--h, 200) var(--accent-s) var(--accent-l));
    display: flex; flex-direction: column; gap: 4px; padding: 22px;
    background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--accent);
    border-radius: 14px; color: inherit; text-decoration: none;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 24px rgb(0 0 0 / .14); }
  .emoji {
    width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 6px;
    border-radius: 12px; font-size: 1.6rem;
    background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  }
  .card h2 { margin: 0; font-size: 1.25rem; }
  .card p { margin: 0; color: var(--muted); }
  .go { margin-top: auto; padding-top: 14px; font-weight: 600; }
  .go::after { content: "→"; display: inline-block; margin-left: .35em; transition: transform .15s; }
  .card:hover .go::after { transform: translateX(4px); }

  @media (prefers-reduced-motion: reduce) { .card, .go::after { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>PROJECTHUB</h1>
      <p class="sub">원하는 서비스를 골라 바로 들어가세요.</p>
    </div>
    <button class="theme" type="button" aria-label="다크 모드" title="다크 / 라이트 전환">
      <span class="moon" aria-hidden="true">🌙</span><span class="sun" aria-hidden="true">☀️</span>
    </button>
  </header>

  <!--
    프로젝트를 추가하려면 아래 <a class="card"> 블록 하나를 복사해 넣는다.
    href: 주소 / --h: 카드 색 (0~360, 빨강 0 · 주황 30 · 노랑 50 · 초록 140 · 청록 175 · 파랑 215 · 보라 270 · 분홍 330)
    내 컴퓨터(XAMPP)에서 확인할 때는 href 를 ../TRIPMATE/ , ../DINNERSPOT/ 로 바꾼다
  -->
  <div class="cards">
    <a class="card" style="--h:175" href="https://tripmate.infinityfree.me/">
      <span class="emoji" aria-hidden="true">🧳</span>
      <h2>TripMate</h2>
      <p>친구들과 여행지를 투표로 정하고, 일정을 같이 짜요.</p>
      <span class="go">열기</span>
    </a>
    <a class="card" style="--h:16" href="https://dinnerspot.infinityfree.me/">
      <span class="emoji" aria-hidden="true">🍻</span>
      <h2>DinnerSpot</h2>
      <p>회식 장소를 조건에 맞춰 추천받고, 팀 투표로 정해요.</p>
      <span class="go">열기</span>
    </a>
  </div>
</main>
<script>
  var root = document.documentElement, btn = document.querySelector('.theme');
  function sync() { btn.setAttribute('aria-pressed', root.dataset.theme === 'dark'); }
  btn.onclick = function () {
    var t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = t;
    try { localStorage.setItem('hub-theme', t); } catch (e) {}
    sync();
  };
  sync();
</script>
</body>
</html>
